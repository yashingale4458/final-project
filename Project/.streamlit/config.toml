[theme]
base = "light"
primaryColor = "#1d6b57"
backgroundColor = "#f5f8f7"
secondaryBackgroundColor = "#e6efec"
textColor = "#13261f"
borderColor = "#d1ddd8"
dataframeHeaderBackgroundColor = "#dde9e4"
showWidgetBorder = true
baseRadius = "medium"
buttonRadius = "medium"
font = "sans-serif"
headingFont = "sans-serif"
codeFont = "monospace"
headingFontWeights = [700, 650, 600, 600, 600, 600]
metricValueFontSize = "1.5rem"
redColor = "#b91c1c"
orangeColor = "#b45309"
yellowColor = "#a16207"
greenColor = "#15803d"
blueColor = "#0369a1"
violetColor = "#6d28d9"

[theme.sidebar]
backgroundColor = "#e3ece8"
secondaryBackgroundColor = "#d4e2dc"
textColor = "#13261f"
borderColor = "#c3d3cc"
primaryColor = "#165846"

[server]
port = 8080
address = "0.0.0.0"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
